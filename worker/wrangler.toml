name = "workbench-sync"
main = "../src/sync/worker.ts"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

# Workers Logs and traces. Tokens stay out of log lines in the handler.
[observability]
enabled = true

[observability.traces]
enabled = true

# Live D1 database in Kaleb's Cloudflare account. Schema is already applied remotely.
[[d1_databases]]
binding = "DB"
database_name = "workbench"
database_id = "e87ee84f-66b3-4e33-9aad-ca20e995534c"

# Secrets (do not commit values):
#   npx wrangler secret put ALLOW_DEV_AUTH   # "1" only on a private dev worker
# APPLE_AUDIENCE defaults to com.antigravity.furniture3d inside the worker.
# Optional override:
#   npx wrangler secret put APPLE_AUDIENCE

# Sign in with Apple token revocation on account deletion (DELETE /api/v1/me,
# src/sync/appleRevoke.ts). Without these three the Worker still deletes the
# account but skips revocation. Key: Apple Developer → Keys → a key with
# "Sign in with Apple" enabled for the App ID com.antigravity.furniture3d.
#   npx wrangler secret put APPLE_TEAM_ID       # 10-char Team ID
#   npx wrangler secret put APPLE_KEY_ID        # 10-char Key ID of that key
#   npx wrangler secret put APPLE_PRIVATE_KEY   # full contents of AuthKey_<KEY_ID>.p8
# Optional (defaults to APPLE_AUDIENCE, i.e. the bundle id):
#   npx wrangler secret put APPLE_CLIENT_ID     # com.antigravity.furniture3d

# Describe it cloud route is OFF for 1.0 (DESCRIBE_CLOUD_ENABLED in src/config/features.ts):
# the Worker doesn't mount POST /api/v1/ai/describe, so the [ai] binding and AI_* settings
# below are unused until that flag is turned on.
# Describe it (POST /api/v1/ai/describe): 10 requests a minute per signed-in account.
# Needs wrangler 4.36+. Without this binding the worker falls back to a per-isolate limit.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Describe it cloud fallback: Cloudflare Workers AI. No key or secret; it uses the
# account's free daily allowance (10,000 neurons, resets 00:00 UTC). Past that the
# route answers "quota" and the app says so.
[ai]
binding = "AI"

# Optional settings (defaults in src/ai/aiHandler.ts):
#   WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast" (var)
#   AI_MOCK = "1" (var) returns a canned bookshelf without calling a model.
# Optional and off by default: a paid OpenAI-compatible provider, used only if AI_API_KEY is set
# (alone, or when Workers AI is out of allowance or busy):
#   npx wrangler secret put AI_API_KEY          # e.g. an xAI key
#   npx wrangler secret put AI_BASE_URL         # default https://api.x.ai/v1
#   npx wrangler secret put AI_MODEL            # default grok-4.7
#   npx wrangler secret put AI_REASONING_EFFORT # default "low" on xAI; "none" to omit
